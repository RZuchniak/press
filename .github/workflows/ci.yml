name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/press
      - run: go build ./cmd/pressbench
      - run: ./pressbench -iterations 1 -samples 1
